<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>納税済み - マイデータ カレンダー</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1A1A1A 0%, #31160a 100%);
        font-family: 'Zen Maru Gothic', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 60px;
        border-radius: 20px;
        border: 2px solid rgba(253, 225, 29, 0.3);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.8);
        animation: floatIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        transform: translateY(20px);
        opacity: 0;
    }

    @keyframes floatIn {
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    h1 {
        font-size: 48px;
        color: #FDE11D;
        margin: 0 0 20px 0;
        text-shadow: 3px 3px 0px #E22B22, 5px 5px 15px rgba(0,0,0,0.8);
        letter-spacing: 2px;
    }

    p {
        font-size: 24px;
        color: #F4EBD0;
        margin-bottom: 40px;
        line-height: 1.6;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    .thunder-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
        display: inline-block;
    }

    @keyframes pulse {
        0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(253, 225, 29, 0.5)); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(253, 225, 29, 0.9)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(253, 225, 29, 0.5)); }
    }

    .back-btn {
        background: #E22B22;
        color: white;
        border: 3px solid #1A1A1A;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: 900;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 4px 4px 0px #1A1A1A, 0 10px 20px rgba(0,0,0,0.4);
        transition: all 0.2s;
        font-family: 'Zen Maru Gothic', sans-serif;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #1A1A1A, 0 15px 25px rgba(0,0,0,0.5);
        background: #f7362c;
    }

    .back-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #1A1A1A, 0 2px 5px rgba(0,0,0,0.5);
    }

</style>
</head>
<body>

<div class="container">
    <div class="thunder-icon">⚡</div>
    <h1>納税完了！</h1>
    <p>本日のブラックサンダー税は<br>すでに納付済みです。<br>明日も開発頑張りましょう！</p>
    <a href="hyo.html" class="back-btn">カレンダーに戻る</a>
</div>

</body>
</html>
