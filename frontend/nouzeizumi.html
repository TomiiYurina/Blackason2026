<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>納税済み - マイデータ カレンダー</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #F4EBD0;
        font-family: 'Zen Maru Gothic', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        text-align: center;
        background: #FFFFFF;
        border: 4px solid #3D1C04;
        padding: 60px;
        border-radius: 20px;
        box-shadow: 6px 6px 0px #3D1C04;
        animation: floatIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        transform: translateY(20px);
        opacity: 0;
    }

    @keyframes floatIn {
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    h1 {
        font-size: 48px;
        color: #3D1C04;
        margin: 0 0 20px 0;
        text-shadow: 3px 3px 0px #FDE11D;
        letter-spacing: 2px;
    }

    p {
        font-size: 24px;
        color: #3D1C04;
        margin-bottom: 40px;
        line-height: 1.6;
        font-weight: bold;
    }

    .thunder-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
        display: inline-block;
    }

    @keyframes pulse {
        0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(253, 225, 29, 0.5)); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(253, 225, 29, 0.9)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(253, 225, 29, 0.5)); }
    }

    .back-btn {
        background: #FDE11D;
        color: #3D1C04;
        border: 3px solid #3D1C04;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: 900;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 4px 4px 0px #3D1C04;
        transition: all 0.2s;
        font-family: 'Zen Maru Gothic', sans-serif;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #3D1C04;
        background: #ffe94d;
    }

    .back-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #3D1C04;
    }

</style>
</head>
<body>

<div class="container">
    <div class="thunder-icon">⚡</div>
    <h1 id="status-title">納税完了！</h1>
    <p id="status-desc">本日のブラックサンダー税は<br>すでに納付済みです。<br>明日も開発頑張りましょう！</p>
    <a href="#" id="action-btn" class="back-btn">カレンダーに戻る</a>
</div>

<script>
    const crunchAudio = new Audio('3939.mp3');
    crunchAudio.volume = 1.0;

    function isSameDate(a, b) {
        return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate()
    }

    document.addEventListener('DOMContentLoaded', () => {
        const totalRequired = parseInt(localStorage.getItem('final_tax_to_pay') || '1', 10);
        let paidCount = 0;
        
        const stored = localStorage.getItem('blackthunderTaxStampDate');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (parsed && parsed.date && isSameDate(new Date(), new Date(parsed.date))) {
                    paidCount = parseInt(parsed.count, 10) || 1;
                }
            } catch(e) {
                if (isSameDate(new Date(), new Date(stored))) {
                    paidCount = 1;
                }
            }
        }
        
        const remaining = Math.max(0, totalRequired - paidCount);
        
        const titleEl = document.getElementById('status-title');
        const descEl = document.getElementById('status-desc');
        const btnEl = document.getElementById('action-btn');
        
        if (remaining > 0) {
            titleEl.innerText = `残り納税は${remaining}個です`;
            descEl.innerHTML = `${paidCount}個目の納税を確認しました。<br>残りのブラックサンダーを納税してください！`;
            btnEl.innerText = 'カレンダーに戻る';
            btnEl.onclick = function(e) {
                e.preventDefault();
                crunchAudio.currentTime = 0;
                crunchAudio.play();
                setTimeout(() => {
                    window.location.href = 'hyo.html';
                }, 500);
            }
        } else {
            titleEl.innerText = `お疲れ様です！`;
            descEl.innerHTML = `本日のブラックサンダー税は<br>すべて納付完了しました。<br>明日も開発頑張りましょう！`;
            btnEl.innerText = 'カレンダーに戻る';
            btnEl.onclick = function(e) {
                e.preventDefault();
                crunchAudio.currentTime = 0;
                crunchAudio.play();
                setTimeout(() => {
                    window.location.href = 'hyo.html';
                }, 500);
            }
        }
    });
</script>

</body>
</html>
